<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色トップ倉庫 在庫確認</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --line:#dfe3e8; --ink:#1f2933;
    --sub:#66727f; --accent:#1565c0; --accent-weak:#e3f0ff;
    --ok:#2e7d32; --ok-weak:#e6f4ea; --warn:#b26a00; --empty:#eef1f4;
    --chip:#eef2f6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:15px;line-height:1.5;}
  header{position:sticky;top:0;z-index:20;background:var(--panel);
    border-bottom:1px solid var(--line);padding:10px 14px;}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{font-size:18px;margin:0;}
  .meta{color:var(--sub);font-size:12px;}
  .tabs{display:flex;gap:6px;margin-top:10px;}
  .tab{flex:1;text-align:center;padding:9px 6px;border:1px solid var(--line);
    border-radius:10px;background:var(--panel);color:var(--sub);font-weight:600;cursor:pointer;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  main{padding:12px;max-width:1100px;margin:0 auto;}

  /* 検索・絞り込み */
  .controls{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:12px;}
  .search-box{display:flex;gap:8px;}
  .search-box input{flex:1;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;font-size:16px;}
  .search-box button{padding:0 14px;border:1px solid var(--line);background:var(--chip);
    border-radius:10px;cursor:pointer;font-size:14px;}
  .exact-box{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .exact-box label{display:flex;flex-direction:column;font-size:11px;color:var(--sub);gap:3px;flex:1;min-width:130px;}
  .exact-box input{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .filters label{display:flex;flex-direction:column;font-size:11px;color:var(--sub);gap:3px;}
  .filters select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;background:#fff;min-width:120px;}
  .chk{flex-direction:row !important;align-items:center;font-size:13px !important;
    color:var(--ink) !important;gap:6px;align-self:flex-end;padding-bottom:6px;}
  .count{color:var(--sub);font-size:13px;margin:4px 2px 10px;}

  /* 一覧テーブル */
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;}
  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;}
  th{position:sticky;top:0;background:#f0f3f7;cursor:pointer;user-select:none;font-size:12px;color:var(--sub);}
  th .arrow{font-size:10px;opacity:.5;}
  tbody tr:active{background:var(--accent-weak);}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  td.loc{font-weight:700;color:var(--accent);}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;}
  .badge.has{background:var(--ok-weak);color:var(--ok);}
  .badge.zero{background:var(--empty);color:var(--sub);}

  /* 一覧カード（スマホ用・横スクロールなし） */
  .list-cards{display:none;}
  .lc{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;margin-bottom:10px;cursor:pointer;}
  .lc:active{background:var(--accent-weak);}
  .lc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .lc-loc{font-weight:700;color:var(--accent);font-size:16px;}
  .lc-qty .badge{font-size:13px;padding:2px 10px;}
  .lc-main{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px;}
  .lc-main .kvp{display:flex;gap:5px;align-items:baseline;}
  .lc-main .kvp .k{color:var(--sub);font-size:11px;}
  .lc-main .kvp .v{font-weight:600;}
  .lc-sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
    display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--sub);}
  .lc-sub .kvp{display:flex;gap:5px;align-items:baseline;}
  .lc-sub .kvp .v{font-weight:600;color:var(--ink);}
  .list-empty{color:var(--sub);text-align:center;padding:24px;}

  /* スマホ用の並び替えバー（テーブルの見出しクリックが使えないため） */
  .sort-bar{display:none;align-items:center;gap:8px;margin:0 2px 10px;font-size:13px;color:var(--sub);}
  .sort-bar select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;}
  .sort-bar button{padding:7px 11px;border:1px solid var(--line);background:var(--chip);
    border-radius:9px;font-size:14px;cursor:pointer;}

  /* 狭い画面はカード、広い画面はテーブル */
  @media (max-width:560px){
    .table-wrap{display:none;}
    .list-cards{display:block;}
    .sort-bar{display:flex;}
  }

  /* 置場マップ */
  #view-map{display:none;}
  .map-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--sub);align-items:center;}
  .dot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;}
  .area-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    margin-bottom:12px;overflow:hidden;}
  .area-head{display:flex;justify-content:space-between;align-items:center;
    padding:12px;background:#f0f3f7;cursor:pointer;user-select:none;}
  .area-block.open .area-head{border-bottom:1px solid var(--line);}
  .area-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
  .area-name .caret{display:inline-block;transition:transform .15s;color:var(--sub);font-size:12px;}
  .area-block.open .area-name .caret{transform:rotate(90deg);}
  .area-stat{font-size:12px;color:var(--sub);}
  .carts{display:none;flex-wrap:wrap;gap:7px;padding:12px;}
  .area-block.open .carts{display:flex;}
  .cart{min-width:46px;padding:7px 6px;border-radius:9px;text-align:center;cursor:pointer;
    border:1px solid var(--line);background:var(--empty);color:var(--sub);}
  .cart.has{background:var(--ok-weak);border-color:#bfe0c6;color:var(--ok);}
  .cart .cno{font-weight:700;font-size:14px;display:block;}
  .cart .cqty{font-size:10px;}

  /* 詳細モーダル */
  .modal{display:none;position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:50;
    align-items:flex-end;justify-content:center;}
  .modal.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;
    max-height:82vh;overflow:auto;padding:16px;}
  .sheet h3{margin:0 0 4px;}
  .sheet .close{float:right;border:none;background:var(--chip);border-radius:8px;
    padding:6px 12px;cursor:pointer;font-size:14px;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:10px;font-size:14px;}
  .kv dt{color:var(--sub);}
  .kv dd{margin:0;font-weight:600;}
  .detail-item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;}
  @media (min-width:560px){ .modal{align-items:center;} .sheet{border-radius:16px;} }
  /* QRコード */
  .qr-cell{display:flex;align-items:flex-start;justify-content:center;flex-shrink:0;}
  .qr-cell svg{width:100%;height:auto;max-width:180px;background:#fff;display:block;border:1px solid var(--line);}
  .qr-cell > div{width:100%;max-width:180px;}
  .detail-item.with-qr{display:flex;gap:14px;align-items:flex-start;}
  .detail-item.with-qr .kv{flex:1;margin-top:0;min-width:0;}
  .detail-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  .detail-top .kv{flex:1;margin-top:0;min-width:200px;}
  .qr-caption{font-size:12px;color:var(--ink);text-align:center;margin-top:5px;word-break:break-all;font-weight:600;}
  @media (max-width:420px){
    .detail-item.with-qr{flex-direction:column;align-items:center;}
    .qr-cell svg,.qr-cell > div{max-width:200px;}
  }
</style>
<script>
/* 画面の自動リロード（5分ごと）。ネット経由で開いているときのみ有効。
   ローカルfile:で開いているときはリロードしても意味がないので無効化。
   配信側は約10分ごとに更新するので、受信側は5分間隔で追従する。
   GitHub Pagesのキャッシュで古いHTMLが出ないよう、URL末尾に時刻クエリを付けて読み直す。 */
(function(){
  var MINUTES = 5;
  if(location.protocol === "http:" || location.protocol === "https:"){
    setTimeout(function(){
      try{
        var u = location.href.split("#")[0].split("?")[0];
        location.replace(u + "?t=" + Date.now());
      }catch(e){
        location.reload();
      }
    }, MINUTES*60*1000);
  }
})();
</script>
<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

  "use strict";
  var D = INVENTORY_DATA, M = INVENTORY_META;
  var state = { view:"list", q:"", quality:"", status:"", hasStock:false,
                exPlace:"", exQuality:"", exColor:"", exDyeNo:"",
                sortKey:"place", sortDir:1 };
  var mapOpen = {};   // 置場マップで開いているエリア名の記録（再描画後も開閉を維持）

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmtNum(n){ return (Number(n)||0).toLocaleString("ja-JP",{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function fmtDate(s){ s=String(s||""); return s.length===8 ? s.slice(0,4)+"/"+s.slice(4,6)+"/"+s.slice(6,8) : s; }

  // メタ表示（generatedAt = HTMLを作った時刻 = データの鮮度）
  var autoNote = (location.protocol==="http:"||location.protocol==="https:") ? " ／ 自動更新中（約10分ごと）" : "";
  $("dataMeta").textContent = "最終更新 " + (M.generatedAt||"") + " ／ " + (M.rowCount||D.length) + "件" + autoNote;

  // プルダウンの選択肢を作る
  function uniqueSorted(key){
    var set={}; D.forEach(function(r){ var v=r[key]; if(v!==""&&v!=null) set[v]=1; });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,"ja",{numeric:true}); });
  }
  function fillSelect(sel, values){
    values.forEach(function(v){ var o=document.createElement("option"); o.value=v; o.textContent=v; sel.appendChild(o); });
  }
  fillSelect($("fQuality"), uniqueSorted("quality"));
  fillSelect($("fStatus"), uniqueSorted("status"));

  // 絞り込み。applyHasStock=false のときは「在庫ありのみ」を無視（マップ用）
  function filtered(applyHasStock){
    if(applyHasStock===undefined) applyHasStock = true;
    // 検索語は半角/全角スペースで区切り、各語をすべて含む行だけ残す（AND検索）
    var terms = state.q.trim().toLowerCase().split(/[\s\u3000]+/).filter(Boolean);
    // 完全一致の検索ボックス（前後空白・大文字小文字は無視して厳密一致）
    function normEx(v){ return String(v==null?"":v).trim().toLowerCase(); }
    var exPlace = normEx(state.exPlace), exQuality = normEx(state.exQuality),
        exColor = normEx(state.exColor), exDyeNo = normEx(state.exDyeNo);
    return D.filter(function(r){
      if(state.quality && r.quality!==state.quality) return false;
      if(state.status && r.status!==state.status) return false;
      if(exPlace   && normEx(r.place)!==exPlace)     return false;
      if(exQuality && normEx(r.quality)!==exQuality) return false;
      if(exColor   && normEx(r.color)!==exColor)     return false;
      if(exDyeNo   && normEx(r.dyeNo)!==exDyeNo)      return false;
      if(applyHasStock && state.hasStock && !(Number(r.qty)>0)) return false;
      if(terms.length){
        var hay = (r.place+" "+r.quality+" "+r.color+" "+r.dyeNo+" "+r.label).toLowerCase();
        for(var i=0;i<terms.length;i++){ if(hay.indexOf(terms[i])<0) return false; }
      }
      return true;
    });
  }
  function sortRows(rows){
    var k=state.sortKey, dir=state.sortDir;
    var numeric = (k==="qty"||k==="free"||k==="reserved");
    return rows.slice().sort(function(a,b){
      var x=a[k], y=b[k];
      if(numeric){ x=Number(x)||0; y=Number(y)||0; return (x-y)*dir; }
      return String(x).localeCompare(String(y),"ja",{numeric:true})*dir;
    });
  }

  // 一覧描画（PC=テーブル / スマホ=カード の両方を同じデータで作る）
  function renderList(){
    var rows = sortRows(filtered());
    $("listCount").textContent = rows.length + " 件表示";

    // --- テーブル（広い画面） ---
    var html = rows.map(function(r){
      var badge = Number(r.qty)>0 ? '<span class="badge has">'+fmtNum(r.qty)+'</span>'
                                  : '<span class="badge zero">0</span>';
      return '<tr data-idx="'+r._i+'">'
        + '<td class="loc">'+esc(r.place)+'</td>'
        + '<td>'+esc(r.quality)+'</td>'
        + '<td>'+esc(r.color)+'</td>'
        + '<td>'+esc(r.dyeNo)+'</td>'
        + '<td>'+esc(r.status)+'</td>'
        + '<td class="num">'+badge+'</td>'
        + '<td class="num">'+fmtNum(r.free)+'</td>'
        + '<td class="num">'+fmtNum(r.reserved)+'</td>'
        + '<td>'+fmtDate(r.lastIn)+'</td>'
        + '</tr>';
    }).join("");
    $("tbody").innerHTML = html || '<tr><td colspan="9" style="text-align:center;color:var(--sub);padding:24px;">該当なし</td></tr>';

    // --- カード（スマホ・横スクロールなし） ---
    // 主表示: 保管場所・品質・色番・染順号・数量 / 補助: 進行・未予約・予約・最終受入
    var cardHtml = rows.map(function(r){
      var badge = Number(r.qty)>0 ? '<span class="badge has">'+fmtNum(r.qty)+'</span>'
                                  : '<span class="badge zero">0</span>';
      function kv(k,v,cls){ return '<span class="kvp"><span class="k">'+k+'</span><span class="v '+(cls||"")+'">'+v+'</span></span>'; }
      return '<div class="lc" data-idx="'+r._i+'">'
        + '<div class="lc-top">'
        +   '<span class="lc-loc">'+esc(r.place)+'</span>'
        +   '<span class="lc-qty">'+badge+'</span>'
        + '</div>'
        + '<div class="lc-main">'
        +   kv("品質", esc(r.quality))
        +   kv("色番", esc(r.color))
        +   kv("染順号", esc(r.dyeNo))
        + '</div>'
        + '<div class="lc-sub">'
        +   kv("進行", esc(r.status||"-"))
        +   kv("未予約", fmtNum(r.free))
        +   kv("予約", fmtNum(r.reserved))
        +   kv("最終受入", fmtDate(r.lastIn))
        + '</div>'
        + '</div>';
    }).join("");
    $("listCards").innerHTML = cardHtml || '<p class="list-empty">該当なし</p>';

    // ソート矢印（テーブル見出し）
    Array.prototype.forEach.call(document.querySelectorAll("#tbl th"), function(th){
      var a=th.querySelector(".arrow");
      a.textContent = (th.dataset.key===state.sortKey) ? (state.sortDir>0?"▲":"▼") : "";
    });
    // スマホ並び替えバーの状態を同期
    if($("sortSel")) $("sortSel").value = state.sortKey;
    if($("sortDirBtn")) $("sortDirBtn").textContent = (state.sortDir>0 ? "昇順▲" : "降順▼");
  }

  // 置場マップ描画。エリアごとに1行（折りたたみ見出し）で表示する。
  //  - 見出し行（2F, A, B…）をタップでそのエリアの置き場（A1,A2…）を開閉
  //  - 置き場をタップで中身一覧（モーダル）
  //  - 「エリア」という文字は出さない（エリア名そのものだけを見出しにする）
  //  - マップでは「在庫ありのみ」を無視し、在庫0も表示（色で有無を示す）
  function renderMap(){
    var rows = filtered(false);
    // エリア → 保管場所コード単位に集約
    var areas = {};
    rows.forEach(function(r){
      var a = r.area || "(不明)";
      if(!areas[a]) areas[a] = { places:{} };
      var key = r.place;           // 保管場所コードそのものでまとめる（M, B45, B2H2-01 等）
      if(!areas[a].places[key]) areas[a].places[key] = { qty:0, items:[] };
      areas[a].places[key].qty += Number(r.qty)||0;
      areas[a].places[key].items.push(r._i);
    });
    var areaNames = Object.keys(areas).sort(function(a,b){ return a.localeCompare(b,"ja",{numeric:true}); });
    var html = areaNames.map(function(a){
      var places = areas[a].places;
      var keys = Object.keys(places).sort(function(x,y){ return x.localeCompare(y,"ja",{numeric:true}); });
      var hasN = keys.filter(function(k){ return places[k].qty>0; }).length;
      var cells = keys.map(function(k){
        var p = places[k];
        var has = p.qty>0;
        // ラベルはエリア接頭辞を外した残り（A1 → 1）。無ければ保管場所コードそのまま。
        var label = String(k);
        if(a && label.indexOf(a)===0 && label.length>a.length) label = label.slice(a.length);
        if(label==="") label = k;
        var n = p.items.length;
        return '<div class="cart '+(has?"has":"")+'" data-items="'+p.items.join(",")+'" data-cart="'+esc(k)+'">'
          + '<span class="cno">'+esc(label)+'</span>'
          + (has?'<span class="cqty">'+fmtNum(p.qty)+(n>1?'（'+n+'件）':'')+'</span>'
                :'<span class="cqty">空</span>')
          + '</div>';
      }).join("");
      var isOpen = !!mapOpen[a];
      return '<div class="area-block'+(isOpen?" open":"")+'" data-area="'+esc(a)+'">'
        + '<div class="area-head"><span class="area-name"><span class="caret">▶</span>'+esc(a)+'</span>'
        + '<span class="area-stat">場所 '+keys.length+' ／ 在庫あり '+hasN+'</span></div>'
        + '<div class="carts">'+cells+'</div></div>';
    }).join("");
    $("mapRoot").innerHTML = html || '<p style="color:var(--sub);text-align:center;padding:24px;">該当なし</p>';
  }

  function render(){
    try{
      if(state.view==="list") renderList(); else renderMap();
    }catch(err){
      var box = (state.view==="list") ? $("tbody") : $("mapRoot");
      var msg = '<div style="color:#b00020;padding:16px;font-size:13px;white-space:pre-wrap;">'
              + '表示エラー: '+esc(err && err.message ? err.message : String(err))
              + '</div>';
      if(state.view==="list"){ box.innerHTML = '<tr><td colspan="9">'+msg+'</td></tr>'; }
      else { box.innerHTML = msg; }
    }
  }

  // QR用テキスト
  // 構成: 染順号 [空白] ラベルNO [空白×3] 置場(3文字右空白埋め) [空白] 数量(小数点を除いた値=数量×10の整数)
  //   例) D605084 / 1 / X65 / 262.0kg → "D605084 1   X65 2620"
  //   例) D605219 / 1 / M   / 60.0kg  → "D605219 1   M   600"（置場Mは3文字幅に空白埋め→"M  "、区切り空白1つ）
  function qrTextOf(r){
    var dyeNo = (r.dyeNo!=null) ? String(r.dyeNo).trim() : "";
    var label = (r.label!=null && String(r.label).trim()!=="") ? String(r.label).trim() : "";
    var place = (r.place!=null) ? String(r.place).trim() : "";
    // 置場は3文字固定幅（右を半角スペースで埋める）。3文字より長い場合はそのまま。
    while(place.length < 3){ place += " "; }
    // 数量は小数第1位まで（kg）。小数点を取り除いた整数にする（262.0 → 2620、60.0 → 600）。
    var qtyNum = Number(r.qty);
    if(!isFinite(qtyNum)) qtyNum = 0;
    var qty10 = Math.round(qtyNum * 10);
    return dyeNo + " " + label + "   " + place + " " + qty10;
  }
  // QRブロックのHTML（SVG＋キャプション）
  function qrBlockHtml(r, px){
    var t = qrTextOf(r);
    return '<div class="qr-cell"><div>'+makeQrSvg(t, px||160)
         + '<div class="qr-caption">'+esc(t)+'</div></div></div>';
  }

  // 予約（引当）内訳のHTML
  function reservationsHtml(r){
    var rv = r.reservations || [];
    if(!rv.length) return '<p style="color:var(--sub);font-size:13px;margin-top:12px;">予約内訳なし</p>';
    var rows = rv.map(function(v){
      return '<tr><td>'+esc(v.no)+'</td><td class="num">'+fmtNum(v.qty)+'</td>'
           + '<td>'+fmtDate(v.date)+'</td></tr>';
    }).join("");
    return '<div style="margin-top:14px;">'
      + '<div style="font-weight:700;font-size:13px;color:var(--sub);margin-bottom:6px;">予約内訳（引当）'+rv.length+'件</div>'
      + '<table style="width:100%;font-size:13px;border-collapse:collapse;">'
      + '<thead><tr style="color:var(--sub);font-size:11px;">'
      + '<th style="text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);">引当順号</th>'
      + '<th style="text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);">引当量</th>'
      + '<th style="text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);">引当日</th>'
      + '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  // モーダル（1件 or 台車の中身）
  function openDetailByIndex(idx){
    var r = D[idx]; if(!r) return;
    $("modalTitle").textContent = r.place + "　" + r.quality + " " + r.color;
    $("modalBody").innerHTML =
      '<div class="detail-top">'
      + '<dl class="kv">'
      + '<dt>保管場所</dt><dd>'+esc(r.place)+'</dd>'
      + '<dt>品質</dt><dd>'+esc(r.quality)+'</dd>'
      + '<dt>色番</dt><dd>'+esc(r.color)+'</dd>'
      + '<dt>染順号</dt><dd>'+esc(r.dyeNo)+'</dd>'
      + '<dt>ラベルNO</dt><dd>'+esc(r.label||"-")+'</dd>'
      + '<dt>進行状況</dt><dd>'+esc(r.status||"-")+'</dd>'
      + '<dt>数量(在庫量)</dt><dd>'+fmtNum(r.qty)+'</dd>'
      + '<dt>未予約量</dt><dd>'+fmtNum(r.free)+'</dd>'
      + '<dt>予約量</dt><dd>'+fmtNum(r.reserved)+'</dd>'
      + '<dt>初回受入日</dt><dd>'+fmtDate(r.firstIn)+'</dd>'
      + '<dt>最終受入日</dt><dd>'+fmtDate(r.lastIn)+'</dd>'
      + '</dl>'
      + qrBlockHtml(r, 180)
      + '</div>'
      + reservationsHtml(r);
    $("modal").classList.add("show");
  }
  function openCart(cart, idxList){
    $("modalTitle").textContent = "置き場 " + cart + "（" + idxList.length + "件）";
    var body = idxList.map(function(i){
      var r=D[i];
      var label = (r.label!=null && String(r.label).trim()!=="") ? String(r.label).trim() : "";
      return '<div class="detail-item with-qr">'
        + '<dl class="kv">'
        + '<dt>染順号</dt><dd>'+esc(r.dyeNo)+'</dd>'
        + '<dt>ラベルNO</dt><dd>'+esc(label||"-")+'</dd>'
        + '<dt>品質</dt><dd>'+esc(r.quality)+'</dd>'
        + '<dt>色番</dt><dd>'+esc(r.color)+'</dd>'
        + '<dt>数量</dt><dd>'+fmtNum(r.qty)+'（未予約 '+fmtNum(r.free)+' / 予約 '+fmtNum(r.reserved)+'）</dd>'
        + '<dt>最終受入日</dt><dd>'+fmtDate(r.lastIn)+'</dd>'
        + '</dl>'
        + qrBlockHtml(r, 150)
        + '</div>';
    }).join("");
    $("modalBody").innerHTML = body;
    $("modal").classList.add("show");
  }
  function closeModal(){ $("modal").classList.remove("show"); }

  // イベント
  $("q").addEventListener("input", function(e){ state.q=e.target.value; render(); });
  $("clearBtn").addEventListener("click", function(){
    state.q=""; $("q").value="";
    state.exPlace=state.exQuality=state.exColor=state.exDyeNo="";
    $("exPlace").value=$("exQuality").value=$("exColor").value=$("exDyeNo").value="";
    render();
  });
  $("exPlace").addEventListener("input", function(e){ state.exPlace=e.target.value; render(); });
  $("exQuality").addEventListener("input", function(e){ state.exQuality=e.target.value; render(); });
  $("exColor").addEventListener("input", function(e){ state.exColor=e.target.value; render(); });
  $("exDyeNo").addEventListener("input", function(e){ state.exDyeNo=e.target.value; render(); });
  $("fQuality").addEventListener("change", function(e){ state.quality=e.target.value; render(); });
  $("fStatus").addEventListener("change", function(e){ state.status=e.target.value; render(); });
  $("fHasStock").addEventListener("change", function(e){ state.hasStock=e.target.checked; render(); });

  Array.prototype.forEach.call(document.querySelectorAll("#tbl th"), function(th){
    th.addEventListener("click", function(){
      var k=th.dataset.key;
      if(state.sortKey===k) state.sortDir=-state.sortDir; else { state.sortKey=k; state.sortDir=1; }
      renderList();
    });
  });
  $("tbody").addEventListener("click", function(e){
    var tr=e.target.closest("tr"); if(tr&&tr.dataset.idx) openDetailByIndex(Number(tr.dataset.idx));
  });
  // カード（スマホ）のタップ → 詳細モーダル
  $("listCards").addEventListener("click", function(e){
    var card=e.target.closest(".lc"); if(card&&card.dataset.idx) openDetailByIndex(Number(card.dataset.idx));
  });
  // スマホ用 並び替えバー
  $("sortSel").addEventListener("change", function(e){ state.sortKey=e.target.value; renderList(); });
  $("sortDirBtn").addEventListener("click", function(){ state.sortDir=-state.sortDir; renderList(); });
  $("mapRoot").addEventListener("click", function(e){
    // 置き場セルのタップ → 中身モーダル
    var cell=e.target.closest(".cart");
    if(cell){
      var items=(cell.dataset.items||"").split(",").filter(Boolean).map(Number);
      openCart(cell.dataset.cart, items);
      return;
    }
    // エリア見出し行のタップ → 開閉
    var head=e.target.closest(".area-head");
    if(head){
      var block=head.closest(".area-block");
      var a=block && block.dataset.area;
      if(a!=null){
        mapOpen[a] = !mapOpen[a];
        block.classList.toggle("open", mapOpen[a]);
      }
    }
  });
  $("modalClose").addEventListener("click", closeModal);
  $("modal").addEventListener("click", function(e){ if(e.target===$("modal")) closeModal(); });

  function switchView(v){
    state.view=v;
    $("tabList").classList.toggle("active", v==="list");
    $("tabMap").classList.toggle("active", v==="map");
    $("view-list").style.display = v==="list" ? "block" : "none";
    $("view-map").style.display  = v==="map"  ? "block" : "none";
    render();
  }
  $("tabList").addEventListener("click", function(){ switchView("list"); });
  $("tabMap").addEventListener("click", function(){ switchView("map"); });

  render();
})();
</script>
</body>
</html>
